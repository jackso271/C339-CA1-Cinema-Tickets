
name: Cinema Ticket Unit Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/run-pytest.yml"

  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/run-pytest.yml"

  workflow_dispatch:

concurrency:
  group: cinema-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest -v
